[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-evals"
version = "0.1.0"
description = "Minimal agent runtime with durable state, a human review gate, and CI-blocking evals. Synthetic data only."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Diego Lescano" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage==7.16.2",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=agent_runtime --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Frozen measurement scripts and logs. Left as recorded; not product code.
extend-exclude = ["docs/demo/dashboard_v2/evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_runtime"]
mypy_path = "src"
warn_unused_configs = true
# Same frozen scripts. Duplicate analyze.py modules are evidence, not a package.
exclude = ["docs/demo/dashboard_v2/evidence"]
disallow_any_generics = true
no_implicit_optional = true

[tool.setuptools.package-data]
agent_runtime = ["py.typed"]
